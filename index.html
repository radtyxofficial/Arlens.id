        const canvas = document.getElementById('snow-canvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const snowflakes = [];
        const maxSnowflakes = 45;

        for (let i = 0; i < maxSnowflakes; i++) {
            snowflakes.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                radius: Math.random() * 2.2 + 0.8,
                density: Math.random() * maxSnowflakes,
                speedY: Math.random() * 0.7 + 0.4,
                speedX: Math.random() * 0.4 - 0.2
            });
        }

        function drawSnow() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = 'rgba(255, 255, 255, 0.75)';
            ctx.beginPath();
            for (let i = 0; i < snowflakes.length; i++) {
                let sf = snowflakes[i];
                ctx.moveTo(sf.x, sf.y);
                ctx.arc(sf.x, sf.y, sf.radius, 0, Math.PI * 2, true);
            }
            ctx.fill();
            updateSnow();
        }

        let angle = 0;
        function updateSnow() {
            angle += 0.01;
            for (let i = 0; i < snowflakes.length; i++) {
                let sf = snowflakes[i];
                sf.y += sf.speedY;
                sf.x += Math.sin(angle + sf.density) * 0.4 + sf.speedX;

                if (sf.y > canvas.height + 10) {
                    sf.y = -10;
                    sf.x = Math.random() * canvas.width;
                }
                if (sf.x > canvas.width + 10) {
                    sf.x = -10;
                } else if (sf.x < -10) {
                    sf.x = canvas.width + 10;
                }
            }
        }

        function loopSnow() {
            drawSnow();
            requestAnimationFrame(loopSnow);
        }
        loopSnow();

            isMusicPlaying = playing;

                musicToggle.classList.add('playing');
            } else {
                musicIcon.className = 'fa-solid fa-volume-xmark';
                musicToggle.classList.remove('playing');
            }
        }

        function toggleMusic() {
            if (isMusicPlaying) {
                bgMusic.pause();
                updateMusicUI(false);
            } else {
                bgMusic.play().then(() => {
                    updateMusicUI(true);
                }).catch(err => {
                    console.log("Audio play prevented:", err);
                });
            }
        }

        musicToggle.addEventListener('click', (e) => {
            e.stopPropagation();

        });

            if (!isMusicPlaying) {

        const observerOptions = {
            threshold: 0.15

        const observer = new IntersectionObserver((entries, observer) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {

        function updateIndicator(activeLink) {
            if (!navIndicator || window.innerWidth <= 992) return;
            const parentList = activeLink.parentElement.parentElement;
            const linkRect = activeLink.getBoundingClientRect();
            const parentRect = parentList.getBoundingClientRect();
            
            const leftOffset = linkRect.left - parentRect.left;
            const width = linkRect.width;

            navIndicator.style.transform = `translateX(${leftOffset}px)`;
            navIndicator.style.width = `${width}px`;
        }

        window.addEventListener('load', () => {
            const activeLink = document.querySelector('.nav-link.active') || navLinks[0];
            updateIndicator(activeLink);

            let currentSection = 'home';

            sections.forEach(section => {
                const sectionHeight = section.offsetHeight;
                const sectionTop = section.offsetTop - 120;
                const sectionId = section.getAttribute('id');

                if (scrollY >= sectionTop && scrollY < sectionTop + sectionHeight) {
                    currentSection = sectionId;

            }

                    link.classList.add('active');
                    updateIndicator(link);
                }
