<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARLENS.ID | Creative Visual & Digital Invitation</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@1,600&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-main: #121d21;
            --bg-card: rgba(42, 51, 56, 0.7);
            --bg-card-solid: #2a3338;
            --accent-copper: #975a41;
            --accent-terracotta: #b7785c;
            --accent-gold: #e5ac31;
            --text-cream: #edebde;
            --text-muted: #a0aab0;
            --grid-color: rgba(229, 172, 49, 0.05);
            --border-color: rgba(183, 120, 92, 0.2);
            --glow-color: rgba(229, 172, 49, 0.35);
            --shadow-subtle: rgba(0,0,0,0.4);
        }

        [data-theme="light"] {
            --bg-main: #edebde;
            --bg-card: rgba(255, 255, 255, 0.85);
            --bg-card-solid: #ffffff;
            --accent-copper: #975a41;
            --accent-terracotta: #b7785c;
            --accent-gold: #975a41;
            --text-cream: #121d21;
            --text-muted: #4a555a;
            --grid-color: rgba(18, 29, 33, 0.06);
            --border-color: rgba(151, 90, 65, 0.25);
            --glow-color: rgba(183, 120, 92, 0.25);
            --shadow-subtle: rgba(0,0,0,0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-cream);
            background-image: 
                linear-gradient(var(--grid-color) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
            background-size: 32px 32px;
            overflow-x: hidden;
            transition: background-color 0.4s ease, color 0.4s ease;
        }

        /* --- INTRO SCREEN --- */
        #intro-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #121d21;
            background-image: 
                linear-gradient(rgba(229, 172, 49, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(229, 172, 49, 0.04) 1px, transparent 1px);
            background-size: 30px 30px;
            z-index: 99999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }

        .intro-welcome {
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: 6px;
            color: #e5ac31;
            opacity: 0;
            animation: welcomeAnim 2.2s ease forwards;
        }

        .intro-brand {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            opacity: 0;
            transform: scale(0.9);
            animation: brandAnim 2.5s ease 2s forwards;
        }

        .intro-logo {
            max-width: 180px;
            height: auto;
            margin-bottom: 15px;
            filter: drop-shadow(0 0 15px rgba(229, 172, 49, 0.4));
        }

        .intro-tagline {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-size: 1.25rem;
            color: #edebde;
            letter-spacing: 1px;
        }

        .skip-btn {
            position: absolute;
            bottom: 30px;
            right: 30px;
            background: rgba(42, 51, 56, 0.8);
            border: 1px solid #b7785c;
            color: #edebde;
            padding: 10px 22px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
            z-index: 100000;
        }

        @keyframes welcomeAnim {
            0% { opacity: 0; transform: translateY(20px); }
            40% { opacity: 1; transform: translateY(0); }
            70% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-20px); }
        }

        @keyframes brandAnim {
            0% { opacity: 0; transform: scale(0.9); }
            100% { opacity: 1; transform: scale(1); }
        }

        /* --- HEADER & NAVBAR --- */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 18px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(18, 29, 33, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            z-index: 1000;
            transition: all 0.3s ease;
        }

        [data-theme="light"] header {
            background: rgba(237, 235, 222, 0.85);
        }

        .logo-container {
            display: flex;
            align-items: center;
            text-decoration: none;
            z-index: 1001;
        }

        .logo-2d {
            height: 40px;
            width: auto;
            object-fit: contain;
            filter: drop-shadow(0 2px 5px var(--glow-color));
            transition: all 0.3s ease;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 28px;
            align-items: center;
        }

        nav a {
            text-decoration: none;
            color: var(--text-cream);
            font-weight: 500;
            font-size: 0.95rem;
            transition: color 0.3s ease;
            position: relative;
        }

        nav a:hover, nav a.active {
            color: var(--accent-gold);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 15px;
            z-index: 1001;
        }

        .theme-toggle, .mobile-menu-btn {
            background: var(--bg-card-solid);
            border: 1px solid var(--border-color);
            color: var(--text-cream);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.1rem;
            transition: all 0.3s ease;
        }

        .mobile-menu-btn {
            display: none;
        }

        /* --- HERO SECTION --- */
        .hero {
            min-height: 100vh;
            padding: 140px 8% 80px 8%;
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            align-items: center;
            gap: 40px;
            perspective: 1000px;
        }

        .hero-text h1 {
            font-size: 2.8rem;
            line-height: 1.2;
            font-weight: 800;
            margin-bottom: 20px;
            color: var(--text-cream);
            letter-spacing: -0.5px;
        }

        .hero-text h1 span {
            color: var(--accent-gold);
            background: linear-gradient(135deg, var(--accent-gold), var(--accent-terracotta));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero-text p {
            font-size: 1.05rem;
            color: var(--text-muted);
            line-height: 1.7;
            margin-bottom: 35px;
            max-width: 620px;
        }

        .hero-cta {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 14px 28px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.95rem;
            text-decoration: none;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
            border: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent-copper), var(--accent-gold));
            color: #121d21;
            box-shadow: 0 4px 15px var(--glow-color);
        }

        .btn-secondary {
            background: transparent;
            color: var(--text-cream);
            border: 2px solid var(--border-color);
        }

        /* 3D Phone Container */
        .hero-visual {
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .phone-mockup-wrap {
            width: 270px;
            height: 520px;
            background: #1e262a;
            border-radius: 35px;
            padding: 10px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5), 0 0 30px var(--glow-color);
            border: 3px solid #2a3338;
            transform-style: preserve-3d;
            transition: transform 0.1s ease-out;
            position: relative;
        }

        .phone-screen {
            width: 100%;
            height: 100%;
            background: #0f1619;
            border-radius: 25px;
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .phone-notch {
            position: absolute;
            top: 8px;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 20px;
            background: #1e262a;
            border-radius: 10px;
            z-index: 10;
        }

        .invitation-preview {
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, rgba(18,29,33,0.4), rgba(42,51,56,0.95)), url('https://images.unsplash.com/photo-1606800052052-a08af7148866?auto=format&fit=crop&w=600&q=80') center/cover;
            padding: 40px 20px 20px 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            text-align: center;
            color: #edebde;
            box-sizing: border-box;
        }

        .inv-title {
            font-family: 'Playfair Display', serif;
            font-size: 0.9rem;
            color: #e5ac31;
            margin-top: 15px;
            letter-spacing: 1px;
        }

        .inv-names {
            font-family: 'Playfair Display', serif;
            font-size: 1.6rem;
            font-weight: 700;
            margin: 5px 0;
            color: #ffffff;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }

        .inv-badge {
            background: rgba(229, 172, 49, 0.2);
            border: 1px solid #e5ac31;
            padding: 8px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            color: #e5ac31;
            margin-bottom: 10px;
            animation: pulseGlow 2s infinite alternate;
            backdrop-filter: blur(4px);
        }

        @keyframes pulseGlow {
            from { box-shadow: 0 0 5px rgba(229, 172, 49, 0.3); }
            to { box-shadow: 0 0 15px rgba(229, 172, 49, 0.8); }
        }

        /* --- ABOUT SECTION --- */
        .section-title {
            text-align: center;
            margin-bottom: 40px;
        }

        .section-title h2 {
            font-size: 2.2rem;
            font-weight: 800;
            color: var(--text-cream);
            letter-spacing: 0.5px;
        }

        .section-title p {
            color: var(--accent-terracotta);
            font-size: 0.9rem;
            margin-top: 8px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .about-section {
            padding: 80px 8%;
            display: grid;
            grid-template-columns: 0.8fr 1.2fr;
            gap: 50px;
            align-items: center;
        }

        .about-3d-logo-wrap {
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1000px;
        }

        .logo-3d-box {
            width: 260px;
            height: 260px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(10px);
            box-shadow: 0 15px 35px var(--shadow-subtle);
            transform-style: preserve-3d;
            transition: transform 0.2s ease-out;
        }

        .logo-3d-box img {
            max-width: 170px;
            height: auto;
            transform: translateZ(40px);
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.5));
        }

        .about-content p {
            color: var(--text-muted);
            line-height: 1.8;
            font-size: 1rem;
            margin-bottom: 20px;
            text-align: justify;
        }

        /* --- PRODUCTS & SHOWCASE TABS --- */
        .products-section {
            padding: 80px 8%;
            background: rgba(0, 0, 0, 0.15);
        }

        .tab-navigation {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }

        .tab-btn {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-cream);
            padding: 10px 24px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .tab-btn:hover, .tab-btn.active {
            background: var(--accent-copper);
            color: #ffffff;
            border-color: var(--accent-copper);
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 20px;
            backdrop-filter: blur(8px);
            transition: all 0.35s ease;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        .card:hover {
            transform: translateY(-6px);
            border-color: var(--accent-gold);
            box-shadow: 0 10px 25px var(--glow-color);
        }

        .card-img {
            width: 100%;
            height: 200px;
            border-radius: 12px;
            object-fit: cover;
            margin-bottom: 20px;
            background-color: var(--bg-card-solid);
        }

        .card-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-cream);
            margin-bottom: 6px;
        }

        .card-category {
            font-size: 0.75rem;
            color: var(--accent-gold);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .card-price {
            font-size: 1.1rem;
            font-weight: 800;
            color: var(--accent-terracotta);
            margin-bottom: 20px;
            margin-top: auto; 
        }

        .card-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-cream);
            padding: 10px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
        }

        /* --- CONTACT & MESSAGE SECTION --- */
        .contact-section {
            padding: 80px 8%;
        }

        .contact-container {
            display: grid;
            grid-template-columns: 0.9fr 1.1fr;
            gap: 40px;
        }

        .contact-info {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .contact-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 20px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            gap: 15px;
            text-decoration: none;
            color: var(--text-cream);
            transition: all 0.3s ease;
        }

        .contact-card:hover {
            border-color: var(--accent-gold);
            transform: translateY(-3px);
        }

        .contact-icon {
            width: 45px;
            height: 45px;
            background: rgba(229, 172, 49, 0.15);
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--accent-gold);
            font-size: 1.2rem;
            flex-shrink: 0;
        }

        .contact-details h4 {
            font-size: 1rem;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .contact-details p {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        /* Message Form */
        .contact-form {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 25px;
            border-radius: 16px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--text-cream);
        }

        .form-control {
            width: 100%;
            padding: 12px 14px;
            background: var(--bg-card-solid);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-cream);
            font-size: 0.9rem;
            outline: none;
        }

        .form-control:focus {
            border-color: var(--accent-gold);
        }

        textarea.form-control {
            resize: vertical;
            min-height: 100px;
        }

        /* --- FOOTER --- */
        footer {
            background: var(--bg-card-solid);
            border-top: 1px solid var(--border-color);
            padding: 60px 8% 30px 8%;
        }

        .footer-grid {
            display: grid;
            grid-template-columns: 1.5fr 1fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }

        .footer-brand h3 {
            font-size: 1.4rem;
            font-weight: 800;
            color: var(--text-cream);
            margin-bottom: 10px;
        }

        .footer-col h4 {
            font-size: 1rem;
            font-weight: 700;
            color: var(--accent-gold);
            margin-bottom: 15px;
        }

        .footer-col ul { list-style: none; }
        .footer-col ul li { margin-bottom: 8px; }
        .footer-col ul li a {
            text-decoration: none;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        /* --- RESPONSIVE MOBILE TWEAKS --- */
        @media (max-width: 992p
